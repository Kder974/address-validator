# Fragment Nginx : publication des fichiers de decouverte de l'API.
#
# POURQUOI UN FRAGMENT ET PAS UN conf.d ?
#   `nginx-hardening.conf` vit dans conf.d/ parce qu'il ne contient que des
#   directives valables en contexte `http` (limit_req, add_header, ...).
#   Or `location` n'est PAS valable en contexte `http` : un fragment de
#   decouverte DOIT donc etre inclus dans le bloc `server`, pas dans conf.d.
#
# INSTALLATION (sur le VPS, en root) :
#   1. cp nginx-discovery.conf /etc/nginx/snippets/address-validator-discovery.conf
#   2. ajouter UNE ligne dans le bloc `server` du vhost
#      /etc/nginx/sites-available/address-validator :
#          include /etc/nginx/snippets/address-validator-discovery.conf;
#   3. nginx -t && systemctl reload nginx
#
# ATTENTION (meme piege que nginx-hardening.conf) : `certbot --nginx` reecrit le
#   vhost a chaque obtention/renouvellement. La ligne `include` peut alors
#   disparaitre : apres tout passage de certbot, verifier que les trois URL de
#   decouverte repondent encore 200 (voir DISCOVERY.md §3).
#
# VERIFICATION :
#   curl -sS -o /dev/null -w '%{http_code}\n' https://kder-ai.com/llms.txt

# --- 1. llms.txt : decouverte par les LLM et les agents ---------------------
# `= /llms.txt` (location exacte) : aucun prefixe ne peut detourner la route.
location = /llms.txt {
    alias /opt/address-validator/llms.txt;
    default_type text/markdown;
    charset utf-8;
    add_header Cache-Control "public, max-age=3600";
}

# --- 2. AGENTS.md : mode d'emploi machine pour les agents ------------------
location = /AGENTS.md {
    alias /opt/address-validator/AGENTS.md;
    default_type text/markdown;
    charset utf-8;
    add_header Cache-Control "public, max-age=3600";
}

# --- 3. security.txt (RFC 9116) : canal de signalement --------------------
# `alias` sur un fichier : nginx exige que le chemin soit absolu et lisible par
# l'utilisateur qui execute les workers (www-data).
location = /.well-known/security.txt {
    alias /opt/address-validator/.well-known/security.txt;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "public, max-age=3600";
}

# --- 4. /mcp et /.well-known/mcp-server : servis par l'application ---------
# Ces deux chemins existent depuis le Lot B (decision D37), mais ils ne sont
# **pas** copies ici : la carte de decouverte decrit un endpoint reel, elle doit
# donc disparaitre avec lui. Un `alias` statique repondrait encore 200 apres
# l'arret du service Python et ferait declarer aux agents une URL morte (D28).
#
# Consequence pratique : ne pas ajouter de `location` pour ces deux chemins.
# Ils doivent atteindre l'application par le `location /` du vhost, qui la
# proxifie sur 127.0.0.1:8000.
#
# `ard.json` reste non publie : la specification « ARD » n'est documentee par
# aucune source verifiable. Publier un format invente n'aide personne.
