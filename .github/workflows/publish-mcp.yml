name: Publish to MCP Registry

# Publication au registre MCP officiel (gratuit). OIDC : aucun secret à stocker.
# Déclenchement manuel depuis l'onglet Actions, ou sur un tag de version.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # authentification OIDC du registre
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # D107 : version epinglee et empreinte verifiee. Ce binaire publie au registre en
      # notre nom : `latest` installerait sans controle ce qui sortirait le jour meme.
      - name: Install mcp-publisher
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
