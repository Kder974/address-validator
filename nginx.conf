server {
    listen 80;
    server_name kder-ai.com www.kder-ai.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # D56 : on remplace l'en-tête reçu au lieu d'y ajouter l'IP réelle. Un
        # client ne peut plus glisser une fausse IP devant celle que Nginx voit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
