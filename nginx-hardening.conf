# Durcissement HTTP de l'API Address Validator (VPS kder-ai.com, nginx 1.22).
#
# INSTALLATION : /etc/nginx/conf.d/address-validator-hardening.conf
#   cp nginx-hardening.conf /etc/nginx/conf.d/address-validator-hardening.conf
#   nginx -t && systemctl reload nginx
#
# POURQUOI conf.d ET PAS LE VHOST ?
#   Le vhost (sites-available/address-validator) est ecrit par
#   `certbot --nginx --redirect`, qui reecrit le fichier a chaque
#   obtention/renouvellement : tout ajout manuel peut disparaitre. Ce fichier-ci
#   est inclus par /etc/nginx/nginx.conf (`include /etc/nginx/conf.d/*.conf;`)
#   dans le contexte `http`, donc il s'applique a tous les serveurs et survit a
#   Certbot. `limit_req` et `add_header` sont tous deux valides dans le
#   contexte `http`.

# 1. Limitation de debit par adresse IP -------------------------------
# 10 requetes/s par IP, rafale immediate de 20. L'application n'a AUCUN rate
# limiting (decision D21) : c'est le seul garde-fou de volume devant
# POST /validate (chaque appel non paye consomme du CPU pour verifier la preuve
# HMAC, chaque appel paye consomme un credit SmartyStreets). 429 plutot que le
# 503 par defaut : « trop de requetes », pas « service en panne ».
limit_req_zone $binary_remote_addr zone=addr_validator:10m rate=10r/s;
limit_req zone=addr_validator burst=20 nodelay;
limit_req_status 429;

# 2. Taille de corps maximale -----------------------------------------
# Le contrat public n'accepte qu'un petit objet JSON : 16 ko laissent une marge
# tres large et ferment les envois massifs.
client_max_body_size 16k;

# 3. En-tetes de securite ---------------------------------------------
# HSTS 1 an, sous-domaines inclus. Tous les noms servis par ce nginx
# (kder-ai.com, www.kder-ai.com) sont en HTTPS (Certbot + redirection 301).
# ATTENTION : `includeSubDomains` interdit le HTTP en clair pour tout
# sous-domaine de kder-ai.com pendant la duree du max-age ; retirer ce
# parametre si un sous-domaine doit rester en HTTP.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;

# 4. Version de Nginx masquee ------------------------------------------
# L'en-tete `Server` et error.log ne publient plus la version exacte
# (`nginx/1.22.1`) : c'est une aide au ciblage, gratuite a retirer
# (AUDIT_TRAFIC_VPS.md, §8.1 point 2). Applique sur le VPS le 13/10/2026 ;
# ce fichier en reste la source d'installation.
server_tokens off;
